# 路径配置（平台路径可用环境变量覆盖，便于云桌面/容器/本地三处运行）
#
# 平台约定（《训推平台使用指南》）：
#   /2026aicompetition/workspace        私有存储（answer/ train_model/ common/）
#   /2026aicompetition/public_*         只读挂载（公共数据集/模型）
workspace: /2026aicompetition/workspace

raw:
  # 比赛训练集根目录（平台实测：`/2026aicompetition/datasets/training` 下只有 `annotation/`，
  #   影像与 SeriesType.xlsx 都在 `training/annotation/`；填上一层会**自动下钻并告警**，
  #   所以这两层填哪个都能跑通，见 README.md §2.2「数据布局」）
  # 可用环境变量覆盖：export DATASET_ROOT=/your/path
  track4: /2026aicompetition/datasets/training
  # 官方验证集根目录（**可选**）：填了即启用"外部验证集"评估分支 ——
  #   最终指标以官方验证集为准（全折集成，不做留一）；留空则回退折内 val（OOF）。
  #   验证集实测布局 `verification/original/`（影像/标注表/SeriesType.xlsx 同层），
  #   数据根填 `…/verification` 或 `…/verification/original` 都能扫通。
  # 可用环境变量覆盖：export VAL_ROOT=/your/path/verification
  val: ""

uif_root: data/uif              # 统一中间格式（原图 + 掩码 + 标签）
manifest: data/manifest.json    # 扫描清单（病例/序列/掩码/结构化）
manifest_val: data/manifest_val.json   # 官方验证集清单（bash scripts/01_probe.sh --val 生成；
                                #   不存在=不启用外部验证集分支，见 raw.val 说明）
folds: data/folds.json          # 多折划分
preprocessed_root: data/preprocessed
preprocess_cache: data/preprocess_cache   # 1mm 公共网格 + 整脑视图缓存（scripts/13_build_cache.py）
logs_dir: logs                  # 平台环境自动切换为 {workspace}/logs（规范要求）
checkpoints_dir: checkpoints
runs_dir: runs
stats_file: data/dataset_stats.json
answer_root: /2026aicompetition/workspace/answer   # 推理结果（{evaluation_id}/）
